<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/bl-icons/bl-icons.css">
<title>Projects</title>
<style>
.grid-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:20px}
.card{position:relative;display:flex;flex-direction:column;padding:15px;background:#f9f9f9;box-shadow:0 2px 5px #0002;text-align:left;cursor:pointer;transition:opacity .3s}
.card:hover{opacity:.5;background-size:contain;background-repeat:no-repeat;background-position:center}
.gif-card{aspect-ratio:1;justify-content:center;align-items:center;gap:5px;background-size:contain;background-repeat:no-repeat;background-position:center}
.link-icon{position:absolute;right:5px;bottom:0;width:32px;height:32px;background-size:contain;background-repeat:no-repeat;background-position:center;pointer-events:none}
.studio-title{margin-bottom:6px;font-size:18px;font-weight:bold}
.project-label{display:block;margin-bottom:4px;font-size:15px}
.tag{--s:5px;border:0;padding:5px;clip-path:polygon(0 0,calc(100% - var(--s)) 0,100% var(--s),100% 100%,var(--s) 100%,0 calc(100% - var(--s)));transform-origin:center;transition:transform .3s cubic-bezier(.25,.46,.45,.94)}
.tag:hover{cursor:pointer;transform:rotate(-3deg)}
@media(max-width:600px){.grid-container{display:flex;flex-direction:column}.card{width:calc(100% - 16px);height:50px;margin:0 8px 0 0;padding:10px;overflow:hidden}.studio-title{margin-bottom:4px;font-size:14px}.project-label{margin-bottom:2px;overflow:hidden;font-size:13px;white-space:nowrap;text-overflow:ellipsis}}
</style>
</head>
<body>
<nav class="nav-bar">
<a href="../../index.html" class="wii">
	<div class="nav-card">
		<label>‎HOME</label>
	</div>
</a>
</nav>
<p class="content-space"></p>
<center>
<button class="tag" style="background:white;color:black" onclick="filterCards('white')">My Parts Only</button>
<button class="tag" style="background:yellow;color:black" onclick="filterCards('yellow')">Screenshots Only</button>
<button class="tag" style="background:pink;color:black" onclick="filterCards('pink')">Full project</button>
<button class="tag" style="background:purple;color:white" onclick="filterCards('gif')">GIFs</button>
<button class="tag" style="background:orange" onclick="filterCards('orange')">To Be Added</button>
<button class="tag" style="background:lightblue;color:black" onclick="filterCards('all')">Show All <span id="card-count"></span></button>

<br><br>
<div id="tb" class="grid-container"></div>
</center>
<script>
let allCards=[];
fetch("data.json").then(response=>response.json()).then(data=>{
  const container=document.getElementById("tb");
  for(const [title,projects] of Object.entries(data)){
    for(const [name,project] of Object.entries(projects)){
      const card=document.createElement("div"),link=project.link,isGif=link?.toLowerCase().endsWith(".gif");
      card.className="card";
      card.style.backgroundColor=project.color||"#fff";
      card.dataset.color=project.color||"white";
      if(project.color==="black")card.style.color="white";
      if(isGif){
        card.classList.add("gif-card");
        card.style.backgroundImage=`url(${link})`;
        card.style.color="transparent";
        card.dataset.color="gif";
      }else{
        const studioTitle=document.createElement("div"),label=document.createElement("span");
        studioTitle.className="studio-title";
        studioTitle.textContent=title;
        label.className="project-label";
        label.textContent=name;
        card.append(studioTitle,label);
      }
      if(link){
        const lowerLink=link.toLowerCase();
        let iconUrl="";
        if(lowerLink.includes("x.com"))iconUrl="https://upload.wikimedia.org/wikipedia/commons/6/6f/Logo_of_Twitter.svg";
        else if(/\.(jpg|jpeg|png|webp)(?:[?#]|$)/i.test(link))iconUrl="https://upload.wikimedia.org/wikipedia/commons/6/6b/Picture_icon_BLACK.svg";
        else if(lowerLink.includes("youtube.com"))iconUrl="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg";
        else if(lowerLink.includes("instagram.com"))iconUrl="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg";
        else if(lowerLink.includes("tumblr.com"))iconUrl="https://upload.wikimedia.org/wikipedia/commons/4/43/Tumblr.svg";
        else if(lowerLink.includes("tba"))iconUrl="https://upload.wikimedia.org/wikipedia/commons/4/4c/Tabler-icons_lock.svg";
        if(iconUrl){
          const icon=document.createElement("div");
          icon.className="link-icon";
          icon.style.backgroundImage=`url("${iconUrl}")`;
          card.appendChild(icon);
        }
      }
      card.addEventListener("click",()=>window.open(link,"_blank"));
      container.appendChild(card);
      allCards.push(card);
    }
  }
  document.getElementById("card-count").textContent = ` : ${allCards.length}`;
  filterCards("white");
});
function filterCards(color){
  allCards.forEach(card=>card.style.display=color==="all"||card.dataset.color===color?"flex":"none");
}
</script>
<script src="../../assets/js/starfield.js"></script>
</body>
</html>
